# =============================================================================
# KLAURO POSTGRESQL CONFIGURATION
# Optimized PostgreSQL settings for Klauro platform
# This file contains settings optimized for time-series telemetry data
# and analytical workloads with multi-tenant architecture
# =============================================================================

# =============================================================================
# CONNECTION SETTINGS
# =============================================================================

# Connection limits (adjust based on your server capacity)
max_connections = 200                    # Reasonable for medium workload
superuser_reserved_connections = 3       # Reserved for admin tasks

# Authentication
authentication_timeout = 60s             # How long to wait for auth
password_encryption = scram-sha-256       # Strong password encryption

# SSL (enable for production)
ssl = off                                # Set to 'on' for production
# ssl_cert_file = 'server.crt'
# ssl_key_file = 'server.key'
# ssl_ca_file = 'ca.crt'

# =============================================================================
# MEMORY SETTINGS
# =============================================================================

# Shared memory (25% of available RAM for dedicated server)
shared_buffers = 1GB                     # Adjust based on available RAM
huge_pages = try                         # Use huge pages if available

# Per-connection memory
work_mem = 8MB                           # Memory per sort/hash operation
hash_mem_multiplier = 2.0                # Extra memory for hash tables
maintenance_work_mem = 256MB             # Memory for maintenance operations
autovacuum_work_mem = 256MB              # Memory for autovacuum

# Temporary file handling
temp_file_limit = 2GB                    # Limit temp files per session

# =============================================================================
# WAL (Write-Ahead Logging) SETTINGS
# =============================================================================

# WAL configuration for high-write workload (telemetry data)
wal_level = replica                       # Enable replication
wal_buffers = 32MB                       # WAL buffer size
wal_writer_delay = 200ms                 # WAL writer sleep time
wal_writer_flush_after = 1MB             # Force flush after this amount

# Checkpoints (reduce frequency for better performance)
checkpoint_timeout = 15min               # Time between checkpoints
checkpoint_completion_target = 0.8       # Spread checkpoint I/O
checkpoint_flush_after = 256kB           # Force flush during checkpoint
checkpoint_warning = 30s                 # Warn if checkpoints too frequent

# WAL archiving (for backups and replication)
archive_mode = on                        # Enable for production
archive_timeout = 300s                   # Archive WAL every 5 minutes
# archive_command = 'cp %p /backup/wal/%f'  # Uncomment and configure

# =============================================================================
# QUERY PLANNING AND EXECUTION
# =============================================================================

# Query planner settings
random_page_cost = 1.5                   # SSD-optimized setting
seq_page_cost = 1.0                      # Sequential read cost
cpu_tuple_cost = 0.01                    # CPU cost per tuple
cpu_index_tuple_cost = 0.005             # CPU cost per index tuple
cpu_operator_cost = 0.0025               # CPU cost per operator
effective_cache_size = 4GB               # Available cache for query planning
default_statistics_target = 250          # Extended statistics for better plans

# Parallel processing
max_worker_processes = 16                # Total background workers
max_parallel_workers = 8                 # Max parallel workers
max_parallel_workers_per_gather = 4      # Max per query
max_parallel_maintenance_workers = 4     # For maintenance operations
parallel_tuple_cost = 0.1                # Cost of tuple transfer
parallel_setup_cost = 1000.0             # Cost of setting up parallelism

# Join and sort settings
enable_hashjoin = on                     # Enable hash joins
enable_mergejoin = on                    # Enable merge joins  
enable_nestloop = on                     # Enable nested loop joins
enable_sort = on                         # Enable explicit sorts
enable_material = on                     # Enable materialization

# =============================================================================
# STORAGE AND I/O SETTINGS  
# =============================================================================

# Background writer (for smooth I/O)
bgwriter_delay = 200ms                   # Background writer sleep
bgwriter_lru_maxpages = 100              # Pages written per round
bgwriter_lru_multiplier = 2.0            # Factor for additional pages
bgwriter_flush_after = 512kB             # Force flush after this amount

# Asynchronous I/O
effective_io_concurrency = 200           # Concurrent I/O operations (SSD)
maintenance_io_concurrency = 100         # Concurrent maintenance I/O

# =============================================================================
# AUTOVACUUM SETTINGS
# =============================================================================

# Autovacuum configuration (important for high-write workload)
autovacuum = on                          # Enable autovacuum
autovacuum_naptime = 30s                 # Time between autovacuum runs
autovacuum_max_workers = 6               # Max autovacuum workers
autovacuum_vacuum_threshold = 50         # Min deleted tuples for vacuum
autovacuum_vacuum_scale_factor = 0.1     # Fraction of table size
autovacuum_analyze_threshold = 50        # Min modified tuples for analyze
autovacuum_analyze_scale_factor = 0.05   # Fraction for analyze
autovacuum_vacuum_cost_delay = 10ms      # Cost delay for vacuum
autovacuum_vacuum_cost_limit = 2000      # Cost limit per round

# =============================================================================
# LOGGING SETTINGS
# =============================================================================

# Where to log
log_destination = 'stderr'               # Log to stderr
logging_collector = on                   # Enable log collector
log_directory = 'log'                    # Log directory
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'  # Log filename pattern
log_rotation_age = 1d                    # Rotate logs daily
log_rotation_size = 100MB                # Max log file size
log_truncate_on_rotation = on            # Truncate on rotation

# What to log
log_min_duration_statement = 1000ms      # Log slow queries (1 second)
log_statement = 'none'                   # Don't log all statements
log_checkpoints = on                     # Log checkpoint activity
log_connections = off                    # Log connections (disable for performance)
log_disconnections = off                 # Log disconnections
log_lock_waits = on                      # Log lock waits
log_temp_files = 10MB                    # Log temp files > 10MB
log_autovacuum_min_duration = 1000ms     # Log slow autovacuum

# Log format
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h ' # Log prefix
log_timezone = 'UTC'                     # Use UTC for logs

# =============================================================================
# MONITORING AND STATISTICS
# =============================================================================

# Track activities and statistics
track_activities = on                    # Track running commands
track_activity_query_size = 8192         # Max query text size
track_counts = on                        # Track row access statistics
track_io_timing = on                     # Track I/O timing
track_functions = all                    # Track function call stats

# Query statistics (requires pg_stat_statements extension)
shared_preload_libraries = 'pg_stat_statements'  # Preload statistics
pg_stat_statements.max = 10000           # Max tracked statements
pg_stat_statements.track = all           # Track all statements
pg_stat_statements.save = on             # Save stats across restarts

# =============================================================================
# TIME-SERIES OPTIMIZATIONS
# =============================================================================

# Settings optimized for time-series data (telemetry events)
# These settings favor write performance for high-frequency inserts

# Reduce synchronous commits for telemetry data (use async replication)
synchronous_commit = local               # Wait for local WAL flush only
commit_delay = 10000                     # Group commits (10ms)
commit_siblings = 5                      # Min concurrent transactions

# =============================================================================
# EXTENSION CONFIGURATION
# =============================================================================

# Auto-explain for slow queries
auto_explain.log_min_duration = 5s       # Explain queries > 5 seconds
auto_explain.log_analyze = on            # Include actual run times
auto_explain.log_buffers = on            # Include buffer usage
auto_explain.log_timing = on             # Include timing info
auto_explain.log_verbose = on            # Verbose output

# =============================================================================
# REPLICATION SETTINGS (for production)
# =============================================================================

# Hot standby and replication (uncomment for production with replicas)
# hot_standby = on                       # Allow read-only queries on standby
# max_wal_senders = 3                    # Max replication connections
# wal_keep_size = 1GB                    # Keep WAL for replication
# hot_standby_feedback = on              # Send feedback to primary

# =============================================================================
# DEVELOPMENT/TESTING OVERRIDES
# =============================================================================

# Development settings (remove for production)
# These settings prioritize development convenience over performance

# Less aggressive autovacuum for development
# autovacuum_naptime = 5min
# autovacuum_vacuum_scale_factor = 0.2

# More verbose logging for development  
# log_min_duration_statement = 100ms
# log_statement = 'all'
# log_connections = on
# log_disconnections = on

# =============================================================================
# NOTES FOR PRODUCTION DEPLOYMENT
# =============================================================================

# 1. Adjust memory settings based on available RAM:
#    - shared_buffers: 25% of total RAM for dedicated DB server
#    - effective_cache_size: 75% of total RAM
#    - work_mem: Total RAM / max_connections / 4

# 2. Enable SSL and configure certificates for security

# 3. Set up WAL archiving for point-in-time recovery:
#    - archive_mode = on
#    - archive_command = 'cp %p /backup/wal/%f'

# 4. Configure replication if using read replicas:
#    - max_wal_senders = 3
#    - wal_keep_size = 1GB

# 5. Monitor and tune based on actual workload:
#    - Use pg_stat_statements to identify slow queries
#    - Monitor checkpoint frequency and WAL generation
#    - Adjust autovacuum settings based on table sizes

# 6. Consider using connection pooling (PgBouncer) to reduce connection overhead