# =============================================================================
# KLAURO DATABASE CONNECTION POOLING CONFIGURATION
# PgBouncer configuration for optimal PostgreSQL connection management
# =============================================================================

# Database connections
[databases]
klauro_prod = host=localhost port=5432 dbname=klauro_prod user=klauro_user
klauro_dev = host=localhost port=5432 dbname=klauro_dev user=klauro_user
klauro_test = host=localhost port=5432 dbname=klauro_test user=klauro_user

# Users and authentication
[users]
klauro_user = 

# Connection pooling settings
[pgbouncer]

# Pool settings optimized for Klauro workload
# Klauro has mixed workload: frequent short telemetry inserts + longer analytical queries
pool_mode = transaction
max_client_conn = 1000
default_pool_size = 50
min_pool_size = 10
reserve_pool_size = 10
reserve_pool_timeout = 5

# Connection limits per database
max_db_connections = 100
max_user_connections = 100

# Server connection settings
server_round_robin = 1
server_check_query = SELECT 1
server_check_delay = 30
server_connect_timeout = 15
server_login_retry = 3
server_lifetime = 3600
server_idle_timeout = 600

# Client connection settings
client_idle_timeout = 300
client_login_timeout = 60

# Query settings
query_timeout = 0
query_wait_timeout = 120
cancel_wait_timeout = 10

# Authentication
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt
auth_query = SELECT usename, passwd FROM pg_shadow WHERE usename=$1

# Logging
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
log_stats = 1
stats_period = 60

# Admin interface
admin_users = klauro_admin
stats_users = klauro_user, klauro_admin

# Listen settings (configured in systemd/docker)
listen_addr = 127.0.0.1
listen_port = 6432
unix_socket_dir = /var/run/pgbouncer

# Performance tuning
# Optimized for high-frequency telemetry writes and analytical reads
ignore_startup_parameters = extra_float_digits

# Application name tracking
application_name_add_host = 1

# TLS/SSL settings (for production)
# server_tls_sslmode = prefer
# client_tls_sslmode = prefer
# client_tls_key_file = /etc/ssl/private/pgbouncer.key
# client_tls_cert_file = /etc/ssl/certs/pgbouncer.crt
# client_tls_ca_file = /etc/ssl/certs/ca-certificates.crt

# =============================================================================
# ENVIRONMENT-SPECIFIC OVERRIDES
# =============================================================================

# Development environment (comment out for production)
log_disconnections = 0
log_connections = 0
verbose = 0

# Production environment (uncomment for production)
# log_disconnections = 1
# log_connections = 1
# verbose = 0
# server_tls_sslmode = require
# client_tls_sslmode = require