<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Klauro Gauntlet</title>
<style>
  :root {
    --bg: #0b0e14; --panel: #131823; --panel2: #1a2030; --line: #232a3a;
    --text: #e6ebf5; --muted: #8b97ad; --dim: #5c6680;
    --klauro: #6ee7b7; --win: #34d399; --loss: #f87171; --warn: #fbbf24;
    --bar-base: #2a3346; --accent: #7aa2ff;
    --noTools: #64748b; --other: #a78bfa;
    --sidebar-w: 208px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* layout */
  .layout { display: flex; min-height: 100vh; }
  .sidebar { width: var(--sidebar-w); flex: 0 0 var(--sidebar-w); background: var(--panel);
    border-right: 1px solid var(--line); position: fixed; top: 0; left: 0; bottom: 0; overflow-y: auto; z-index: 10; }
  .sb-brand { padding: 18px 18px 14px; border-bottom: 1px solid var(--line); }
  .sb-brand h1 { font-size: 16px; margin: 0; letter-spacing: .3px; }
  .sb-brand h1 .k { color: var(--klauro); }
  .sb-brand .sub { color: var(--dim); font-size: 11px; margin-top: 3px; }
  .nav { padding: 8px 0; }
  .nav a { display: flex; align-items: center; gap: 9px; padding: 8px 18px; color: var(--muted);
    font-size: 13px; border-left: 2px solid transparent; }
  .nav a:hover { color: var(--text); background: #161c2a; text-decoration: none; }
  .nav a.active { color: var(--klauro); border-left-color: var(--klauro); background: rgba(110,231,183,.05); }
  .nav a .ico { width: 16px; text-align: center; opacity: .8; }
  .nav a .ncount { margin-left: auto; font-size: 10px; color: var(--dim); background: var(--panel2);
    padding: 1px 6px; border-radius: 999px; }
  .nav .nav-sec { font-size: 10px; color: var(--dim); text-transform: uppercase; letter-spacing: .6px;
    padding: 14px 18px 5px; }

  .content { flex: 1; margin-left: var(--sidebar-w); min-width: 0; }
  header { padding: 14px 24px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap; position: sticky; top: 0; background: var(--bg); z-index: 5; }
  header .crumb { font-size: 13px; color: var(--muted); }
  header .crumb b { color: var(--text); font-weight: 600; }
  .spacer { flex: 1; }
  .badge { font-size: 11px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line);
    color: var(--muted); white-space: nowrap; }
  .badge.mode { color: var(--accent); border-color: #2c3a5e; }
  .verdict { font-size: 13px; font-weight: 600; padding: 5px 14px; border-radius: 8px; }
  .verdict.win { background: rgba(52,211,153,.12); color: var(--win); border: 1px solid rgba(52,211,153,.35); }
  .verdict.loss { background: rgba(248,113,113,.12); color: var(--loss); border: 1px solid rgba(248,113,113,.35); }
  .verdict.pending { background: var(--panel2); color: var(--muted); border: 1px solid var(--line); }
  button { background: var(--panel2); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 7px 14px; font-size: 13px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  button.primary { background: rgba(110,231,183,.12); border-color: rgba(110,231,183,.4); color: var(--klauro); }
  .progress { height: 4px; background: var(--panel2); }
  .progress > div { height: 100%; background: linear-gradient(90deg, var(--klauro), var(--accent)); transition: width .4s; width: 0; }
  main { padding: 22px 24px 60px; max-width: 1500px; }

  .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 20px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; }
  .card .lbl { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .5px; }
  .card .val { font-size: 28px; font-weight: 700; margin-top: 6px; }
  .card .val.win { color: var(--win); } .card .val.loss { color: var(--loss); }
  .card .hint { color: var(--dim); font-size: 11px; margin-top: 4px; }
  .card.clickable { cursor: pointer; } .card.clickable:hover { border-color: var(--accent); }

  /* delta panels */
  .delta-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 22px; }
  .dpanel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; }
  .dpanel .dphead { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .dpanel .dptitle { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
  .dmetric { display: flex; align-items: baseline; justify-content: space-between; padding: 5px 0; border-top: 1px solid var(--line); }
  .dmetric:first-of-type { border-top: none; }
  .dmetric .dm-lbl { color: var(--dim); font-size: 12px; }
  .dmetric .dm-val { font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .dm-val.pos { color: var(--win); } .dm-val.neg { color: var(--loss); }

  table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; overflow: hidden; }
  th, td { padding: 0; text-align: left; }
  thead th { background: var(--panel2); color: var(--muted); font-weight: 600; font-size: 12px;
    padding: 11px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  thead th.klcol { color: var(--klauro); }
  tbody tr { border-bottom: 1px solid var(--line); }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: #161c2a; }
  tbody tr.rowlink { cursor: pointer; }
  td.tdpad { padding: 11px 14px; vertical-align: middle; }
  td.tdpad.num { font-variant-numeric: tabular-nums; text-align: right; }
  .scell { padding: 13px 14px; vertical-align: top; min-width: 200px; }
  .scell .name { font-weight: 600; }
  .scell .task { color: var(--muted); font-size: 12px; margin-top: 3px; max-width: 320px; }
  .scell .grp { font-size: 10px; color: var(--dim); text-transform: uppercase; letter-spacing: .5px; margin-top: 5px; }
  .armcell { padding: 11px 14px; vertical-align: top; border-left: 1px solid var(--line); min-width: 150px; }
  .armcell.kl { background: rgba(110,231,183,.045); }
  .metric { display: flex; align-items: center; gap: 7px; margin: 4px 0; font-size: 12px; }
  .metric .m-lbl { color: var(--dim); width: 16px; }
  .metric .m-val { width: 62px; text-align: right; font-variant-numeric: tabular-nums; }
  .bar { flex: 1; height: 5px; background: var(--bar-base); border-radius: 3px; overflow: hidden; min-width: 30px; }
  .bar > div { height: 100%; border-radius: 3px; }
  .vcell { padding: 11px 14px; border-left: 1px solid var(--line); vertical-align: top; min-width: 130px; }
  .pill { display: inline-block; font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 6px; }
  .pill.win { background: rgba(52,211,153,.14); color: var(--win); }
  .pill.loss { background: rgba(248,113,113,.14); color: var(--loss); }
  .pill.run { background: var(--panel2); color: var(--warn); }
  .pill.pend { background: var(--panel2); color: var(--dim); }
  .pill.ok { background: rgba(52,211,153,.14); color: var(--win); }
  .pill.no { background: rgba(248,113,113,.14); color: var(--loss); }
  .pill.tie { background: rgba(122,162,255,.15); color: var(--accent); }
  .pill.outcat { background: rgba(167,139,250,.16); color: var(--other); }
  /* camps page */
  .camps-grid { display: grid; grid-template-columns: 1fr; gap: 18px; margin-bottom: 20px; }
  .camp-sec { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; }
  .camp-sec .ch { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; }
  .camp-sec .ch .cn { font-size: 15px; font-weight: 700; }
  .camp-sec .ch .cv { font-size: 11px; font-weight: 600; padding: 2px 9px; border-radius: 999px; }
  .camp-sec .ch .cv.dom { background: rgba(52,211,153,.14); color: var(--win); }
  .camp-sec .ch .cv.tie { background: rgba(122,162,255,.15); color: var(--accent); }
  .camp-sec .ch .cv.out { background: rgba(167,139,250,.16); color: var(--other); }
  .camp-sec .csub { color: var(--muted); font-size: 12px; margin-bottom: 12px; }
  .qbar { display: inline-flex; align-items: center; gap: 8px; width: 150px; }
  .qbar .bar { flex: 1; height: 6px; }
  .qbar .qv { width: 38px; text-align: right; font-variant-numeric: tabular-nums; font-size: 12px; }
  /* full grid matrix swatches */
  .gmatrix { display: flex; flex-wrap: wrap; gap: 3px; margin: 4px 0 2px; }
  .gcell { width: 13px; height: 13px; border-radius: 3px; display: inline-block; }
  .breadth-tile { display: flex; align-items: center; gap: 24px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 20px 24px; margin-bottom: 20px; }
  .breadth-tile .big { font-size: 52px; font-weight: 800; color: var(--klauro); line-height: 1; font-variant-numeric: tabular-nums; }
  .breadth-tile .blbl { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .5px; }
  .breadth-tile .langs { color: var(--dim); font-size: 11px; line-height: 1.7; max-height: 80px; overflow: auto; }
  .tag { display: inline-block; font-size: 10px; padding: 2px 7px; border-radius: 5px; background: var(--panel2);
    color: var(--muted); margin: 1px 3px 1px 0; border: 1px solid var(--line); }
  .reasons { margin-top: 8px; font-size: 11px; color: var(--muted); }
  .reasons .r { margin: 3px 0; padding-left: 12px; position: relative; }
  .reasons .r::before { content: "›"; position: absolute; left: 0; color: var(--dim); }
  .reasons .r.bad { color: var(--loss); }
  .modeflag { font-size: 10px; color: var(--dim); text-transform: uppercase; letter-spacing: .5px; }
  .section-title { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .6px;
    margin: 28px 0 12px; display: flex; align-items: center; gap: 10px; }
  .section-title .st-act { margin-left: auto; }
  .losses { background: rgba(248,113,113,.06); border: 1px solid rgba(248,113,113,.25); border-radius: 12px; padding: 6px 0; }
  .loss-row { padding: 10px 16px; border-bottom: 1px solid rgba(248,113,113,.12); font-size: 13px; }
  .loss-row:last-child { border-bottom: none; }
  .loss-row .sid { color: var(--loss); font-weight: 600; }
  .empty { color: var(--win); padding: 14px 16px; font-size: 13px; }
  .empty.neutral { color: var(--muted); }
  .emptybox { background: var(--panel); border: 1px dashed var(--line); border-radius: 12px; padding: 30px;
    text-align: center; color: var(--muted); font-size: 13px; }
  .loading { color: var(--dim); padding: 30px; text-align: center; font-size: 13px; }
  .foot { color: var(--dim); font-size: 11px; margin-top: 24px; }
  .legend { display: flex; gap: 16px; font-size: 11px; color: var(--muted); margin: 0 0 14px; flex-wrap: wrap; }
  .legend .sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

  /* page header block */
  .phead { display: flex; align-items: flex-start; gap: 16px; margin-bottom: 8px; flex-wrap: wrap; }
  .phead h2 { font-size: 20px; margin: 0; }
  .phead .ppath { color: var(--dim); font-size: 12px; font-family: ui-monospace, Menlo, monospace; margin-top: 4px; word-break: break-all; }
  .phead .pact { margin-left: auto; display: flex; gap: 8px; }
  .pdeltas { display: flex; gap: 18px; flex-wrap: wrap; margin: 6px 0 18px; align-items: center; }
  .pdeltas .pd { font-size: 13px; }
  .pdeltas .pd .pdl { color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: .4px; display: block; }
  .pdeltas .pd .pdv { font-weight: 600; font-variant-numeric: tabular-nums; }

  /* facts panel */
  .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin-bottom: 8px; }
  .fact .fl { color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: .4px; }
  .fact .fv { font-size: 18px; font-weight: 600; margin-top: 3px; }
  .fact .fv.small { font-size: 13px; font-weight: 400; }

  /* JSON tree */
  details.jtree { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 10px; }
  details.jtree > summary { cursor: pointer; padding: 10px 14px; font-size: 12px; color: var(--muted);
    text-transform: uppercase; letter-spacing: .4px; user-select: none; }
  details.jtree > summary:hover { color: var(--text); }
  .jbody { max-height: 420px; overflow: auto; padding: 4px 14px 14px; }
  .jnode { font-family: ui-monospace, Menlo, monospace; font-size: 12px; line-height: 1.5; }
  .jnode details { margin-left: 14px; }
  .jnode summary { cursor: pointer; color: var(--accent); }
  .jnode .jk { color: var(--klauro); }
  .jnode .jv-str { color: var(--warn); }
  .jnode .jv-num { color: var(--accent); }
  .jnode .jv-bool { color: var(--other); }
  .jnode .jv-null { color: var(--dim); }
  .jleaf { margin-left: 14px; }

  /* forms */
  .form { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px; max-width: 720px; margin-bottom: 22px; }
  .form .field { margin-bottom: 14px; }
  .form label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; }
  .form input[type=text], .form textarea, .form select {
    width: 100%; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px;
    color: var(--text); padding: 9px 12px; font-size: 13px; font-family: inherit; }
  .form textarea { min-height: 90px; resize: vertical; }
  .form input:focus, .form textarea:focus, .form select:focus { outline: none; border-color: var(--accent); }
  .form .row { display: flex; gap: 14px; flex-wrap: wrap; }
  .form .row > .field { flex: 1; min-width: 160px; }
  .form .err { color: var(--loss); font-size: 12px; margin-top: 6px; }
  .form .ok { color: var(--win); font-size: 12px; margin-top: 6px; }
  .checks { display: flex; flex-wrap: wrap; gap: 8px; }
  .checks label { display: flex; align-items: center; gap: 6px; background: var(--panel2); border: 1px solid var(--line);
    border-radius: 7px; padding: 6px 10px; font-size: 12px; color: var(--text); cursor: pointer; margin: 0; }

  /* docket / search toolbar */
  .toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .toolbar input[type=text], .toolbar select {
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px; color: var(--text);
    padding: 8px 12px; font-size: 13px; }
  .toolbar input[type=text] { flex: 1; min-width: 200px; }
  .toolbar input:focus, .toolbar select:focus { outline: none; border-color: var(--accent); }
  .toolbar .summary { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .docket-btn { background: var(--panel2); color: var(--muted); border: 1px solid var(--line); border-radius: 7px;
    padding: 6px 11px; font-size: 12px; cursor: pointer; }
  .docket-btn:hover { color: var(--text); border-color: var(--accent); }
  .area { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 14px; overflow: hidden; }
  .area-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: var(--panel2); }
  .area-head .area-name { font-weight: 600; font-size: 13px; }
  .area-head .area-stat { color: var(--dim); font-size: 12px; }
  .file-block { border-top: 1px solid var(--line); }
  .file-head { display: flex; align-items: center; gap: 8px; padding: 9px 16px 9px 22px; cursor: pointer; }
  .file-head:hover { background: #161c2a; }
  .file-head .caret { color: var(--dim); width: 10px; transition: transform .15s; display: inline-block; }
  .file-head.open .caret { transform: rotate(90deg); }
  .file-head .fname { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; color: var(--accent); }
  .file-head .fcount { margin-left: auto; color: var(--dim); font-size: 11px; }
  .test-list { display: none; padding: 2px 16px 10px 40px; }
  .test-list.open { display: block; }
  .test-item { font-size: 12px; color: var(--muted); padding: 3px 0; display: flex; gap: 8px; align-items: baseline; }
  .test-item .tnum { color: var(--dim); font-variant-numeric: tabular-nums; min-width: 26px; text-align: right; }
  .test-item .tname { color: var(--text); }
  .test-item.skipped .tname { color: var(--warn); text-decoration: line-through; opacity: .7; }
  .test-item .tskip { font-size: 10px; color: var(--warn); }
  .hidden { display: none !important; }

  /* test status dots + trend (docket upgrades) */
  .tdot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: 0 0 8px; }
  .tdot.pass { background: var(--win); } .tdot.fail { background: var(--loss); } .tdot.skip { background: var(--warn); }
  .trend { display: inline-flex; gap: 2px; margin-left: auto; align-items: center; }
  .trend i { width: 6px; height: 6px; border-radius: 1px; background: var(--bar-base); display: inline-block; }
  .trend i.pass { background: var(--win); } .trend i.fail { background: var(--loss); } .trend i.skip { background: var(--warn); }
  .runsummary { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 12px 16px; margin-bottom: 14px; }
  .runsummary .rs-msg { color: var(--muted); font-size: 13px; }
  .runsummary .rs-act { margin-left: auto; display: flex; gap: 8px; align-items: center; }

  /* watcher rows + incremental chart */
  .wrow { cursor: pointer; }
  .wrow.sel { background: rgba(110,231,183,.06); }
  .qchart { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin-bottom: 14px; }
  .qchart svg { display: block; width: 100%; height: 120px; overflow: visible; }
  .qchart .qc-pt { fill: var(--klauro); }
  .qchart .qc-zero { stroke: var(--line); stroke-dasharray: 3 3; }
  /* coverage chips */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
  .chip { background: var(--panel2); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; font-size: 12px; color: var(--text); }
  .chip b { color: var(--klauro); }
  .chip.backlog { border-style: dashed; color: var(--muted); }
  .chip .modeflag { margin-left: 4px; }
  .chip.cov-fwchip { cursor: pointer; }
  .chip.cov-fwchip:hover { border-color: var(--accent); }
  /* coverage interactive toolbar */
  .cov-toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 4px 0 14px; }
  .cov-toolbar .docket-filter { flex: 1 1 240px; min-width: 200px; }
  .cov-seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--panel); }
  .cov-segbtn { background: transparent; border: none; color: var(--muted); padding: 7px 12px; font-size: 12px; cursor: pointer; border-right: 1px solid var(--line); }
  .cov-segbtn:last-child { border-right: none; }
  .cov-segbtn:hover { color: var(--text); }
  .cov-segbtn.active { background: var(--panel2); color: var(--klauro); }
  .card.clickable { cursor: pointer; }
  .card.clickable:hover { border-color: var(--accent); }
  .cov-type { display: inline-block; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .4px; padding: 2px 8px; border-radius: 6px; }
  .cov-language { background: rgba(122,162,255,.15); color: var(--accent); }
  .cov-framework { background: rgba(110,231,183,.14); color: var(--klauro); }
  .cov-library { background: rgba(167,139,250,.16); color: var(--other); }
  .cov-row { cursor: pointer; }
  .cov-row:hover { background: #161c2a; }
  .cov-row .caret { color: var(--dim); display: inline-block; width: 10px; }
  tr.cov-detail { background: var(--panel); }
  .cov-dgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 18px; padding: 4px 0 8px; }
  .cov-d { font-size: 12px; color: var(--muted); }
  .cov-d .cov-dl { color: var(--dim); text-transform: uppercase; font-size: 10px; letter-spacing: .4px; margin-right: 6px; }
  .cov-d code { background: var(--panel2); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; font-size: 11px; color: var(--text); margin-right: 4px; display: inline-block; }
  .cov-drillbtn { margin-top: 8px; }
  /* coverage drill-down modal */
  .cov-drill { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 50; align-items: flex-start; justify-content: center; padding: 60px 24px; }
  .cd-modal { background: var(--bg); border: 1px solid var(--line); border-radius: 14px; width: 100%; max-width: 920px; max-height: 80vh; display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  .cd-head { display: flex; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
  .cd-title { font-size: 15px; font-weight: 600; }
  .cd-head .docket-btn { margin-left: auto; }
  .cd-body { padding: 14px 20px 20px; overflow: auto; }
  .cd-sub { color: var(--muted); font-size: 12px; margin-bottom: 12px; }
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="sb-brand">
      <h1><span class="k">Klauro</span> Gauntlet</h1>
      <div class="sub">scenarios × arms × metrics</div>
    </div>
    <nav class="nav" id="nav">
      <a href="#/overview" data-route="overview"><span class="ico">◆</span>Overview</a>
      <div class="nav-sec">Corpus</div>
      <a href="#/workspaces" data-route="workspaces"><span class="ico">▣</span>Workspaces <span class="ncount" id="ncWorkspaces"></span></a>
      <a href="#/repos" data-route="repos"><span class="ico">▤</span>Repos <span class="ncount" id="ncRepos"></span></a>
      <a href="#/coverage" data-route="coverage"><span class="ico">◳</span>Coverage <span class="ncount" id="ncCoverage"></span></a>
      <a href="#/camps" data-route="camps"><span class="ico">⚔</span>Camps <span class="ncount" id="ncCamps"></span></a>
      <a href="#/grid" data-route="grid"><span class="ico">▦</span>Grid <span class="ncount" id="ncGrid"></span></a>
      <div class="nav-sec">Benchmark</div>
      <a href="#/scenarios" data-route="scenarios"><span class="ico">▦</span>Scenarios <span class="ncount" id="ncScenarios"></span></a>
      <a href="#/runs" data-route="runs"><span class="ico">↻</span>Runs <span class="ncount" id="ncRuns"></span></a>
      <a href="#/watchers" data-route="watchers"><span class="ico">◎</span>Watchers <span class="ncount" id="ncWatchers"></span></a>
      <a href="#/tests" data-route="tests"><span class="ico">✓</span>Test docket <span class="ncount" id="ncTests"></span></a>
      <div class="nav-sec">Author</div>
      <a href="#/new-project" data-route="new-project"><span class="ico">＋</span>New project</a>
      <a href="#/proposals" data-route="proposals"><span class="ico">✎</span>Proposals</a>
    </nav>
  </aside>

  <div class="content">
    <header>
      <div class="crumb" id="crumb">Klauro Gauntlet</div>
      <div class="spacer"></div>
      <span class="badge mode" id="modeBadge">—</span>
      <span class="badge" id="runBadge">no run yet</span>
      <div class="verdict pending" id="overallVerdict">awaiting report</div>
    </header>
    <div class="progress"><div id="progressBar"></div></div>
    <main id="view"><div class="loading">loading…</div></main>
  </div>
</div>

<script>
// ============================== helpers ==============================
const $ = id => document.getElementById(id);
const fmtNum = n => n == null ? '—' : (n >= 1000 ? (n/1000).toFixed(n>=100000?0:1)+'k' : Math.round(n));
const fmtMs = ms => ms == null ? '—' : (ms >= 1000 ? (ms/1000).toFixed(1)+'s' : Math.round(ms)+'ms');
function escapeHtml(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function armColor(arm) {
  const k = arm.kind || (arm.isKlauro ? 'klauro' : '');
  if (k === 'klauro') return 'var(--klauro)';
  if (k === 'no-tools') return 'var(--noTools)';
  return 'var(--other)';
}
// fraction -> "+31%"; returns {txt, cls}
function fmtFrac(x) {
  if (x == null || isNaN(x)) return { txt: '—', cls: '' };
  const pct = Math.round(x * 100);
  return { txt: (pct >= 0 ? '+' : '') + pct + '%', cls: pct >= 0 ? 'pos' : 'neg' };
}
function fracSpan(x) { const f = fmtFrac(x); return '<span class="dm-val ' + f.cls + '">' + f.txt + '</span>'; }
function winBadge(win) {
  return win
    ? '<span class="pill win">✓ WIN</span>'
    : '<span class="pill loss">✗ LOSS</span>';
}
function deltaInline(d) {
  d = d || {};
  return '<div class="pdeltas">' +
    pd('Quality lead', d.quality) + pd('Token saving', d.tokens) + pd('Speed-up', d.time) +
    '<div class="pd">' + winBadge(!!d.win) + '</div></div>';
}
function pd(lbl, x) {
  const f = fmtFrac(x);
  return '<div class="pd"><span class="pdl">' + lbl + '</span><span class="pdv ' +
    (f.cls === 'pos' ? '' : f.cls === 'neg' ? '' : '') + '" style="color:' +
    (f.cls === 'pos' ? 'var(--win)' : f.cls === 'neg' ? 'var(--loss)' : 'var(--muted)') + '">' + f.txt + '</span></div>';
}
async function getJSON(url) {
  try { const r = await fetch(url); if (!r.ok) return null; return await r.json(); }
  catch (e) { return null; }
}
function deltaCells(d) {
  d = d || {};
  const q = fmtFrac(d.quality), t = fmtFrac(d.tokens);
  return '<td class="tdpad num"><span style="color:' + (q.cls==='pos'?'var(--win)':q.cls==='neg'?'var(--loss)':'var(--muted)') + '">' + q.txt + '</span></td>' +
         '<td class="tdpad num"><span style="color:' + (t.cls==='pos'?'var(--win)':t.cls==='neg'?'var(--loss)':'var(--muted)') + '">' + t.txt + '</span></td>' +
         '<td class="tdpad">' + winBadge(!!d.win) + '</td>';
}
// scenario delta table (quality/token/time + win) shared by workspace & repo detail
function scenarioDeltaTable(scenarios) {
  if (!scenarios || !scenarios.length) return '<div class="emptybox">No per-scenario deltas available.</div>';
  let rows = scenarios.map(s => {
    const d = s.delta || {};
    const q = fmtFrac(d.quality), t = fmtFrac(d.tokens), ti = fmtFrac(d.time);
    const c = (f) => '<td class="tdpad num"><span style="color:' + (f.cls==='pos'?'var(--win)':f.cls==='neg'?'var(--loss)':'var(--muted)') + '">' + f.txt + '</span></td>';
    return '<tr><td class="tdpad"><div class="name" style="font-weight:600">' + escapeHtml(s.label||s.id) + '</div>' +
      '<div class="grp" style="font-size:10px;color:var(--dim);text-transform:uppercase">' + escapeHtml(s.group||'') + '</div></td>' +
      c(q) + c(t) + c(ti) + '<td class="tdpad">' + winBadge(!!d.win) + '</td></tr>';
  }).join('');
  return '<table><thead><tr><th>Scenario</th><th>Quality</th><th>Tokens</th><th>Time</th><th>Verdict</th></tr></thead><tbody>' + rows + '</tbody></table>';
}
// arms metrics table shared by workspace & repo detail
function armsTable(arms) {
  if (!arms || !arms.length) return '<div class="emptybox">No arm results available.</div>';
  let rows = arms.map(a => {
    const m = a.metrics || {};
    const isKl = a.mode === 'klauro' || /klauro/i.test(a.arm_id||'');
    return '<tr' + (isKl ? ' style="background:rgba(110,231,183,.045)"' : '') + '>' +
      '<td class="tdpad">' + escapeHtml(a.arm_id) + (isKl ? ' <span class="tag" style="color:var(--klauro)">klauro</span>' : '') + '</td>' +
      '<td class="tdpad"><span class="modeflag">' + escapeHtml(a.mode||'') + '</span></td>' +
      '<td class="tdpad num">' + (m.quality != null ? m.quality : '—') + '</td>' +
      '<td class="tdpad num">' + fmtNum(m.tokens) + '</td>' +
      '<td class="tdpad num">' + fmtMs(m.time_ms) + '</td>' +
      '<td class="tdpad">' + (a.attempted ? '<span class="pill ok">attempted</span>' : '<span class="pill pend">n/a</span>') + '</td></tr>';
  }).join('');
  return '<table><thead><tr><th>Arm</th><th>Mode</th><th>Quality</th><th>Tokens</th><th>Time</th><th></th></tr></thead><tbody>' + rows + '</tbody></table>';
}

// recursive JSON tree (collapsible, scroll-safe)
function jsonTree(val, depth) {
  depth = depth || 0;
  if (depth > 8) return '<span class="jv-str">…</span>';
  if (val === null) return '<span class="jv-null">null</span>';
  if (typeof val === 'string') return '<span class="jv-str">"' + escapeHtml(val.length > 400 ? val.slice(0,400)+'…' : val) + '"</span>';
  if (typeof val === 'number') return '<span class="jv-num">' + val + '</span>';
  if (typeof val === 'boolean') return '<span class="jv-bool">' + val + '</span>';
  if (Array.isArray(val)) {
    if (!val.length) return '<span class="jv-null">[]</span>';
    const open = depth < 1 ? ' open' : '';
    let inner = val.slice(0, 200).map((v, i) =>
      '<div class="jleaf"><span class="jk">' + i + '</span>: ' + jsonTree(v, depth+1) + '</div>').join('');
    if (val.length > 200) inner += '<div class="jleaf jv-null">… ' + (val.length-200) + ' more</div>';
    return '<details' + open + '><summary>Array(' + val.length + ')</summary>' + inner + '</details>';
  }
  if (typeof val === 'object') {
    const keys = Object.keys(val);
    if (!keys.length) return '<span class="jv-null">{}</span>';
    const open = depth < 1 ? ' open' : '';
    const inner = keys.slice(0, 200).map(k =>
      '<div class="jleaf"><span class="jk">' + escapeHtml(k) + '</span>: ' + jsonTree(val[k], depth+1) + '</div>').join('');
    return '<details' + open + '><summary>Object(' + keys.length + ')</summary>' + inner + '</details>';
  }
  return '<span>' + escapeHtml(String(val)) + '</span>';
}

// ============================== global state ==============================
let lastReport = null;     // latest GauntletReport (live)
let viewingReport = null;  // a specific run being viewed in the matrix
let catalog = null;        // {scenarios, arms}
let counts = { repos: null, workspaces: null, scenarios: null, runs: null, watchers: null, coverage: null, camps: null, grid: null };

const SCEN_TASK = {
  'cold-onboarding': 'Describe a repo cold — what it is, does, how it is built.',
  'repo-change': 'Implement a small feature and pass tests.',
  'repo-bug': 'Locate + diagnose a bug root cause.',
  'workspace-orientation': 'Describe a multi-repo workspace and how repos fit.',
  'cross-repo-change': 'Change a contract across an API and its consumers.',
  'cross-repo-bug': 'Trace a bug across repo boundaries.',
  'cross-repo-analysis': 'Answer how N repos compose into one product.',
  'incremental-change': 'After a diff, find what changed and its ripple.',
  'security-audit': 'Find auth boundaries, input sinks, secret handling.',
  'test-authoring': 'Write meaningful tests for an under-tested module.',
  'refactor-safety': 'Refactor a core function safely with full blast radius.',
  'dependency-impact': 'Assess what a shared-entity change ripples into.',
  'api-contract-drift': 'Find where an API and its consumers drifted.',
  'onboarding-depth': 'Answer deep how-does-X-work questions with evidence.',
  'analysis-readiness': 'Does the analysis meet objective quality gates?',
};

// ============================== top bar verdict ==============================
function updateTopBar(report) {
  const r = report || lastReport;
  $('modeBadge').textContent = (r && r.mode) || '—';
  $('runBadge').textContent = (r && r.run_id) ? ('run ' + r.run_id) : 'no run';
  const ov = $('overallVerdict');
  if (!r || !r.summary) { ov.className = 'verdict pending'; ov.textContent = 'awaiting report'; return; }
  const sum = r.summary;
  if (r.status !== 'done') { ov.className = 'verdict pending'; ov.textContent = 'running…'; }
  else if (sum.klauro_wins_all) { ov.className = 'verdict win'; ov.textContent = '✓ Klauro wins all ' + (sum.scenarios_won||0); }
  else { ov.className = 'verdict loss'; ov.textContent = '✗ ' + (sum.scenarios_lost||0) + ' loss' + ((sum.scenarios_lost===1)?'':'es'); }
  const p = r.progress || { total_scenarios: 1, completed: 0 };
  $('progressBar').style.width = (100 * (p.completed||0) / Math.max(1, p.total_scenarios||1)) + '%';
}

// ============================== Scenarios matrix (preserved logic) ==============================
function reportFromCatalog(cat) {
  if (!cat || !cat.scenarios) return null;
  return {
    schema_version: 1, run_id: '', generated_at: '', mode: 'projected', status: 'pending',
    progress: { total_scenarios: cat.scenarios.length, completed: 0, running: 0, pending: cat.scenarios.length, errored: 0 },
    arms: cat.arms,
    scenarios: cat.scenarios.map(s => ({
      scenario_id: s.id, label: s.label, group: s.group, status: 'pending',
      execution: s.execution, arms: [], verdict: undefined,
    })),
    summary: { klauro_wins_all: false, scenarios_won: 0, scenarios_lost: 0, losses: [] },
  };
}
function maxAcross(report, getter) {
  let m = 0;
  for (const s of report.scenarios) for (const a of (s.arms||[])) {
    const v = getter(a); if (typeof v === 'number' && v > m) m = v;
  }
  return m || 1;
}
function renderCardsHtml(report) {
  const sum = report.summary || {};
  const adv = (x) => x == null ? '—' : (x>=0?'+':'') + Math.round(x*100) + '%';
  const cards = [
    { lbl: 'Verdict', val: sum.klauro_wins_all ? 'WIN' : (report.status==='done'?'LOSS':'…'),
      cls: sum.klauro_wins_all ? 'win' : (report.status==='done'?'loss':''),
      hint: (sum.scenarios_won||0)+' won · '+(sum.scenarios_lost||0)+' lost' },
    { lbl: 'Avg quality lead', val: adv(sum.avg_quality_advantage), hint: 'vs best competitor' },
    { lbl: 'Avg token saving', val: adv(sum.avg_token_advantage), hint: 'fewer tokens' },
    { lbl: 'Avg speed-up', val: adv(sum.avg_time_advantage), hint: 'faster' },
  ];
  return '<div class="cards">' + cards.map(c =>
    '<div class="card"><div class="lbl">'+c.lbl+'</div><div class="val '+(c.cls||'')+'">'+c.val+'</div><div class="hint">'+c.hint+'</div></div>'
  ).join('') + '</div>';
}
function renderMatrixHtml(report, arms) {
  const maxQ = 100;
  const maxT = maxAcross(report, a => a.metrics && a.metrics.time_ms);
  const maxK = maxAcross(report, a => a.metrics && a.metrics.tokens);
  let head = '<tr><th>Scenario</th>';
  for (const arm of arms) head += '<th class="'+(arm.kind==='klauro'||arm.isKlauro?'klcol':'')+'">'+escapeHtml(arm.label)+'</th>';
  head += '<th>Verdict</th></tr>';
  let rows = '';
  for (const s of report.scenarios) {
    rows += '<tr>';
    rows += '<td class="scell"><div class="name">'+escapeHtml(s.label)+'</div>'+
            '<div class="task">'+escapeHtml(SCEN_TASK[s.scenario_id]||'')+'</div>'+
            '<div class="grp">'+escapeHtml(s.group)+' · '+escapeHtml(s.execution||'')+(s.target?(' · '+escapeHtml(s.target)):'')+'</div></td>';
    const armById = {}; for (const a of (s.arms||[])) armById[a.arm_id] = a;
    for (const arm of arms) {
      const a = armById[arm.id];
      if (!a || !a.attempted) {
        rows += '<td class="armcell '+(arm.kind==='klauro'||arm.isKlauro?'kl':'')+'"><span class="modeflag">n/a</span></td>';
        continue;
      }
      const m = a.metrics; const col = armColor(arm);
      const bar = (val, max, invert) => {
        if (val == null) return '<div class="bar"></div>';
        let frac = Math.min(1, val/max);
        return '<div class="bar"><div style="width:'+(Math.max(4,frac*100))+'%;background:'+col+(invert?';opacity:.6':'')+'"></div></div>';
      };
      rows += '<td class="armcell '+(arm.kind==='klauro'||arm.isKlauro?'kl':'')+'">'+
        '<div class="metric"><span class="m-lbl">Q</span>'+bar(m.quality,maxQ)+'<span class="m-val">'+(m.quality??'—')+'</span></div>'+
        '<div class="metric"><span class="m-lbl">T</span>'+bar(m.time_ms,maxT,true)+'<span class="m-val">'+fmtMs(m.time_ms)+'</span></div>'+
        '<div class="metric"><span class="m-lbl">K</span>'+bar(m.tokens,maxK,true)+'<span class="m-val">'+fmtNum(m.tokens)+'</span></div>'+
        '<span class="modeflag">'+escapeHtml(a.mode)+'</span>'+
      '</td>';
    }
    rows += '<td class="vcell">' + verdictCell(s) + '</td></tr>';
  }
  return '<table><thead>'+head+'</thead><tbody>'+rows+'</tbody></table>';
}
function verdictCell(s) {
  if (s.status === 'pending') return '<span class="pill pend">pending</span>';
  if (s.status === 'running') return '<span class="pill run">running…</span>';
  if (s.status === 'error') return '<span class="pill loss">error</span><div class="reasons"><div class="r bad">'+escapeHtml(s.error||'')+'</div></div>';
  const v = s.verdict; if (!v) return '—';
  const pill = v.klauro_wins ? '<span class="pill win">✓ win</span>' : '<span class="pill loss">✗ loss</span>';
  let reasons = '';
  if (v.reasons && v.reasons.length) {
    reasons = '<div class="reasons">' + v.reasons.slice(0,4).map(r => {
      const bad = /NOT won|below|missing/.test(r);
      return '<div class="r'+(bad?' bad':'')+'">'+escapeHtml(r)+'</div>';
    }).join('') + '</div>';
  }
  return pill + reasons;
}
function renderLossesHtml(report) {
  const losses = (report.summary && report.summary.losses) || [];
  if (!losses.length) {
    return report.status==='done'
      ? '<div class="empty">✓ No losses — Klauro wins every scored scenario.</div>'
      : '<div class="empty neutral">— run in progress —</div>';
  }
  return '<div class="losses">' + losses.map(l =>
    '<div class="loss-row"><span class="sid">'+escapeHtml(l.scenario_id)+'</span> — '+escapeHtml(l.summary)+
    ' <span class="modeflag">[lost: '+(l.losing_metrics||[]).join(', ')+']</span></div>'
  ).join('') + '</div>';
}

// ============================== Test docket (preserved logic) ==============================
function renderTestDocketHtml(inv) {
  let html = '';
  for (const area of inv.areas) {
    html += '<div class="area" data-area="'+escapeHtml(area.area)+'">';
    html += '<div class="area-head"><span class="area-name">'+escapeHtml(area.area)+'</span>'+
            '<span class="area-stat">'+area.test_count+' tests · '+area.file_count+' files</span></div>';
    for (const f of area.files) {
      const fid = 'f_' + f.file.replace(/[^a-z0-9]/gi,'_');
      html += '<div class="file-block" data-file="'+escapeHtml(f.file)+'">';
      html += '<div class="file-head" data-target="'+fid+'"><span class="caret">▸</span>'+
              '<span class="fname">'+escapeHtml(f.file)+'</span>'+
              '<span class="fcount">'+f.count+(f.skipped?(' · '+f.skipped+' skip'):'')+'</span></div>';
      html += '<div class="test-list" id="'+fid+'">';
      f.tests.forEach((t, i) => {
        const dot = t.status ? '<span class="tdot '+escapeHtml(t.status)+'"></span>' : '';
        let trend = '';
        if (Array.isArray(t.history) && t.history.length) {
          trend = '<span class="trend">' + t.history.slice(-10).map(h => '<i class="'+escapeHtml(h)+'"></i>').join('') + '</span>';
        }
        html += '<div class="test-item'+(t.skipped?' skipped':'')+'" data-name="'+escapeHtml((t.name||'').toLowerCase())+'">'+
                dot+'<span class="tnum">'+(i+1)+'</span><span class="tname">'+escapeHtml(t.name)+'</span>'+
                (t.skipped?'<span class="tskip">skip</span>':'')+trend+'</div>';
      });
      html += '</div></div>';
    }
    html += '</div>';
  }
  return html;
}
function wireDocket() {
  document.querySelectorAll('#view .file-head').forEach(h => h.addEventListener('click', () => {
    h.classList.toggle('open');
    const t = $(h.dataset.target); if (t) t.classList.toggle('open');
  }));
}
function filterDocket(q) {
  q = (q||'').trim().toLowerCase();
  const docket = $('testDocket'); if (!docket) return;
  docket.querySelectorAll('.file-block').forEach(fb => {
    const fname = fb.dataset.file.toLowerCase();
    let anyVisible = false;
    fb.querySelectorAll('.test-item').forEach(ti => {
      const match = !q || ti.dataset.name.includes(q) || fname.includes(q);
      ti.classList.toggle('hidden', !match);
      if (match) anyVisible = true;
    });
    fb.classList.toggle('hidden', !anyVisible);
    if (q && anyVisible) {
      fb.querySelector('.file-head').classList.add('open');
      fb.querySelector('.test-list').classList.add('open');
    }
  });
  docket.querySelectorAll('.area').forEach(a => {
    const anyFile = [...a.querySelectorAll('.file-block')].some(fb => !fb.classList.contains('hidden'));
    a.classList.toggle('hidden', !anyFile);
  });
}
function setAllExpanded(open) {
  document.querySelectorAll('#testDocket .file-head').forEach(h => h.classList.toggle('open', open));
  document.querySelectorAll('#testDocket .test-list').forEach(l => l.classList.toggle('open', open));
}

// ============================== run actions ==============================
async function triggerRun(body) {
  try { await fetch('/api/run', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body||{}) }); }
  catch (e) {}
}

// ============================== ROUTER ==============================
const routes = {};
function parseHash() {
  let h = location.hash.replace(/^#\/?/, '');
  if (!h) return { name: 'overview', arg: null };
  const parts = h.split('/');
  return { name: parts[0], arg: parts[1] ? decodeURIComponent(parts.slice(1).join('/')) : null };
}
function setActiveNav(name) {
  document.querySelectorAll('#nav a').forEach(a => a.classList.toggle('active', a.dataset.route === name));
}
function setCrumb(html) { $('crumb').innerHTML = html; }
function setView(html) { $('view').innerHTML = html; }
function loadingView(label) { setView('<div class="loading">' + (label||'loading…') + '</div>'); }

async function router() {
  const { name, arg } = parseHash();
  const handler = routes[name] || routes['overview'];
  setActiveNav(routes[name] ? name : 'overview');
  window.scrollTo(0, 0);
  await handler(arg);
}

// ---------- Overview ----------
routes['overview'] = async () => {
  setCrumb('Overview');
  loadingView();
  const ov = await getJSON('/api/overview');
  if (!ov) { setView('<div class="emptybox">Overview unavailable. The benchmark may not have run yet.</div>'); return; }
  const t = ov.totals || {};
  counts.repos = t.repos; counts.workspaces = t.workspaces; counts.scenarios = t.scenarios; counts.runs = t.runs;
  refreshNavCounts();
  const statCard = (lbl, val, route) =>
    '<div class="card clickable" data-go="' + route + '"><div class="lbl">' + lbl + '</div><div class="val">' + (val==null?'—':val) + '</div></div>';
  const dpanel = (title, d) => {
    d = d || {};
    return '<div class="dpanel"><div class="dphead"><span class="dptitle">' + title + '</span>' + winBadge(!!d.win) + '</div>' +
      '<div class="dmetric"><span class="dm-lbl">Quality lead</span>' + fracSpan(d.quality) + '</div>' +
      '<div class="dmetric"><span class="dm-lbl">Token saving</span>' + fracSpan(d.tokens) + '</div>' +
      '<div class="dmetric"><span class="dm-lbl">Speed-up</span>' + fracSpan(d.time) + '</div></div>';
  };
  let lastRun = '';
  if (ov.last_run) {
    const lr = ov.last_run;
    lastRun = '<div class="section-title">Last run</div>' +
      '<div class="dpanel" style="max-width:640px"><div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">' +
      '<b>' + escapeHtml(lr.run_id||'') + '</b>' +
      '<span class="badge mode">' + escapeHtml(lr.mode||'') + '</span>' +
      '<span class="modeflag">' + escapeHtml(lr.generated_at||'') + '</span>' +

const reposState = { q: '', framework: '', sort: 'nodes', limit: 40, offset: 0, items: [], total: 0, has_more: false, next_offset: 0, frameworks: new Set() };
let reposDebounce = null;
async function fetchRepos(reset) {
  if (reset) { reposState.offset = 0; reposState.items = []; }
  const p = new URLSearchParams();
  if (reposState.q) p.set('q', reposState.q);
  if (reposState.framework) p.set('framework', reposState.framework);
  p.set('sort', reposState.sort); p.set('limit', reposState.limit); p.set('offset', reposState.offset);
  const data = await getJSON('/api/repos?' + p.toString());
  if (!data) return;
  reposState.total = data.total; reposState.has_more = data.has_more; reposState.next_offset = data.next_offset;
  reposState.items = reposState.items.concat(data.repos || []);
  (data.repos||[]).forEach(r => (r.frameworks||[]).forEach(f => reposState.frameworks.add(f)));
  counts.repos = data.total; refreshNavCounts();
}

// ---------- Watchers (incremental gauntlet) ----------
function incrDeltaCell(x) {
  const f = fmtFrac(x);
  return '<td class="tdpad num"><span style="color:' + (f.cls==='pos'?'var(--win)':f.cls==='neg'?'var(--loss)':'var(--muted)') + '">' + f.txt + '</span></td>';
}
function incrChangeText(ch) {
  if (!ch) return '—';
  const files = ch.filesChanged != null ? ch.filesChanged + 'f' : '';
  const nodes = [];
  if (ch.nodesAdded) nodes.push('+' + ch.nodesAdded);
  if (ch.nodesModified) nodes.push('~' + ch.nodesModified);
  if (ch.nodesDeleted) nodes.push('-' + ch.nodesDeleted);
  const risk = ch.riskLevel ? ' <span class="tag">' + escapeHtml(ch.riskLevel) + '</span>' : '';
  return escapeHtml([files, nodes.join('/')].filter(Boolean).join(' · ') || '—') + risk;
}
// minimalist inline svg quality-delta line chart (qualityΔ as %)
function qualitySparkSvg(series) {
  const pts = (series || []).filter(p => p && p.at != null).slice().sort((a,b) => new Date(a.at) - new Date(b.at));
  if (!pts.length) return '<div class="emptybox">No quality-delta points yet.</div>';
  const W = 600, H = 100, padX = 6, padY = 10;
  const vals = pts.map(p => (p.quality == null || isNaN(p.quality)) ? 0 : p.quality);
  let lo = Math.min(0, ...vals), hi = Math.max(0, ...vals);
  if (lo === hi) { lo -= 0.05; hi += 0.05; }
  const n = pts.length;
  const x = i => n === 1 ? W/2 : padX + (i * (W - 2*padX) / (n - 1));
  const y = v => padY + (1 - (v - lo) / (hi - lo)) * (H - 2*padY);
  const yZero = y(0);
  const dots = pts.map((p, i) => '<circle class="qc-pt" cx="' + x(i).toFixed(1) + '" cy="' + y(vals[i]).toFixed(1) + '" r="3"></circle>').join('');
  let poly = '';
  if (n >= 2) poly = '<polyline points="' + pts.map((p,i) => x(i).toFixed(1) + ',' + y(vals[i]).toFixed(1)).join(' ') +
    '" fill="none" stroke="var(--klauro)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></polyline>';
  const last = vals[vals.length-1];
  const f = fmtFrac(last);
  return '<div class="qchart"><div class="dptitle" style="margin-bottom:8px">Quality delta over time' +
    ' <span style="color:' + (f.cls==='pos'?'var(--win)':f.cls==='neg'?'var(--loss)':'var(--muted)') + ';font-weight:600">' + f.txt + ' latest</span></div>' +
    '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none">' +
    '<line class="qc-zero" x1="' + padX + '" y1="' + yZero.toFixed(1) + '" x2="' + (W-padX) + '" y2="' + yZero.toFixed(1) + '"></line>' +
    poly + dots + '</svg></div>';
}
async function loadIncrementalDetail(repoName) {
  const wrap = $('incrDetail');
  if (!wrap) return;

// ---------- Coverage (interactive) ----------
let covData = null;
let covState = { q: '', type: 'all', sync: 'all', verdict: 'all' };
const covExpanded = new Set();

function covDetectStr(d) {
  const parts = [];
  if (d.dependencies && d.dependencies.length) parts.push('deps: ' + d.dependencies.slice(0,4).join(', '));
  if (d.files && d.files.length) parts.push('files: ' + d.files.slice(0,3).join(', '));
  if (d.content && d.content.length) parts.push('content: ' + d.content.length + ' patterns');
  return parts.join(' · ');
}
function covVerdictPill(a) {
  if (a.verdict === 'supported') return '<span class="pill win">✓ measured</span>';
  if (a.verdict === 'thin') return '<span class="pill run">~ thin</span>';
  if (a.verdict === 'blind') return '<span class="pill loss">✗ blind</span>';
  return '<span class="modeflag">—</span>';
}
function covMatches(a) {
  const s = covState;
  if (s.type !== 'all' && a.type !== s.type) return false;
  if (s.sync === 'inc' && !a.incremental) return false;
  if (s.sync === 'full' && a.incremental) return false;
  if (s.verdict === 'measured' && a.verdict !== 'supported') return false;
  if (s.verdict === 'blind' && a.verdict !== 'blind') return false;
  if (s.q) {
    const q = s.q.toLowerCase();
    const hay = (a.id + ' ' + a.name + ' ' + (a.requires||[]).join(' ') + ' ' + covDetectStr(a.detect)).toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}
function renderCovList() {
  const rows = covData.analyzers.filter(covMatches);
  const typeBadge = ty => '<span class="cov-type cov-' + ty + '">' + ty + '</span>';
  let html = rows.map(a => {
    const open = covExpanded.has(a.id);
    let r = '<tr class="cov-row" data-id="' + escapeHtml(a.id) + '">' +
      '<td class="tdpad">' + typeBadge(a.type) + '</td>' +
      '<td class="tdpad"><span class="caret">' + (open ? '▾' : '▸') + '</span> <span class="fname">' + escapeHtml(a.id) + '</span>' +
        (a.measured ? ' <span class="modeflag">' + escapeHtml(a.measured.repo) + ' ' + fmtNum(a.measured.nodes) + ' nodes</span>' : '') + '</td>' +
      '<td class="tdpad" style="color:var(--muted);font-size:12px">' + escapeHtml(covDetectStr(a.detect) || '—') + '</td>' +
      '<td class="tdpad" style="text-align:center">' + (a.incremental ? '<span class="pill win">inc</span>' : '<span class="modeflag">full</span>') + '</td>' +
      '<td class="tdpad">' + covVerdictPill(a) + '</td></tr>';
    if (open) {
      const d = a.detect;
      const line = (lbl, arr) => (arr && arr.length) ? '<div class="cov-d"><span class="cov-dl">' + lbl + '</span> <code>' + arr.map(escapeHtml).join('</code> <code>') + '</code></div>' : '';
      const drill = (a.type === 'framework' || a.type === 'library')
        ? '<button class="docket-btn cov-drillbtn" data-stack="' + escapeHtml(a.id) + '">View repos using this →</button>'
        : '';
      r += '<tr class="cov-detail"><td></td><td colspan="4" class="tdpad">' +
        '<div class="cov-dgrid">' +
        '<div class="cov-d"><span class="cov-dl">name</span> ' + escapeHtml(a.name) + '</div>' +
        '<div class="cov-d"><span class="cov-dl">requires</span> ' + ((a.requires&&a.requires.length)?a.requires.map(escapeHtml).join(', '):'—') + '</div>' +
        line('deps', d.dependencies) + line('files', d.files) + line('content', d.content) +
        '</div>' + drill + '</td></tr>';
    }
    return r;
  }).join('');
  if (!rows.length) html = '<tr><td colspan="5" class="tdpad" style="color:var(--muted)">No analyzers match these filters.</td></tr>';
  $('covCount').textContent = 'showing ' + rows.length + ' of ' + covData.analyzers.length;
  $('covTableBody').innerHTML = html;
  $('covTableBody').querySelectorAll('tr.cov-row').forEach(tr => tr.addEventListener('click', () => {
    const id = tr.dataset.id;
    if (covExpanded.has(id)) covExpanded.delete(id); else covExpanded.add(id);
    renderCovList();
  }));
  $('covTableBody').querySelectorAll('.cov-drillbtn').forEach(b => b.addEventListener('click', e => {
    e.stopPropagation(); openCovDrill(b.dataset.stack);
  }));
}
function covSeg(group, options) {
  return '<div class="cov-seg" data-group="' + group + '">' +
    options.map(o => '<button class="cov-segbtn' + (covState[group] === o.v ? ' active' : '') + '" data-v="' + o.v + '">' + o.t + '</button>').join('') + '</div>';
}
async function openCovDrill(stack) {

    '<td class="tdpad">' + qualityBar(c.klauroF1) + '</td>' +
    '<td class="tdpad">' + qualityBar(c.competitorBestF1) + '</td>' +
    '<td class="tdpad num">' + saveCell(c.tokenSaving) + '</td>' +
    '<td class="tdpad">' + gridVerdictPill(c.verdict) + '</td>' +
    '<td class="tdpad" style="color:var(--muted);font-size:12px;max-width:280px">' + escapeHtml(c.note || (c.armsRan||[]).join(', ')) + '</td></tr>'
  ).join('');
  return '<div class="camp-sec" style="grid-column:1/-1"><div class="ch"><span class="cn">' + escapeHtml(title) + '</span>' +
    '<span class="cv dom">' + covered + ' / ' + cells.length + ' COVERED</span></div>' +
    '<div class="csub">Every supported ' + escapeHtml(kind) + ' × metric cell with an explicit, measured verdict.</div>' +
    strip +
    (rows ? '<table style="margin-top:10px"><thead><tr><th>Row</th><th>Metric</th><th class="klcol">Klauro F1</th><th>Competitor best F1</th><th>Saving</th><th>Verdict</th><th>Arms / note</th></tr></thead><tbody>' + rows + '</tbody></table>'
      : '<div class="empty neutral">No covered cells in this kind yet.</div>') +
    '</div>';
}
function renderGrid(grid) {
  if (!grid || !grid.aggregate) return '<div class="emptybox">Full grid unavailable.</div>';
  const a = grid.aggregate;
  const pct = x => Math.round((x || 0) * 100) + '%';
  // ---- Headline cards ----
  const card = (lbl, val, cls, hint) =>
    '<div class="card"><div class="lbl">' + lbl + '</div><div class="val ' + (cls||'') + '">' + val + '</div>' +
    (hint ? '<div class="hint">' + hint + '</div>' : '') + '</div>';
  const headline = '<div class="cards">' +
    card('Coverage', pct(a.coverage), '', (a.total - a.uncovered) + ' / ' + a.total + ' cells') +
    card('Win-rate on covered', pct(a.winRate), 'win', a.won + ' won · ' + a.ceilingTied + ' ceiling-tied') +
    card('Covered', (a.total - a.uncovered), '', a.total + ' total · ' + a.uncovered + ' uncovered') +
    card('Losses', a.losses, a.losses > 0 ? 'loss' : 'win', a.losses > 0 ? 'Klauro bugs — fix, do not hide' : 'zero losses') +
    '</div>';
  // ---- rows-by-kind summary ----
  const r = grid.rows || {};
  const rowsLine = '<div class="chips">' +
    '<span class="chip">languages <b>' + (r.languages?r.languages.covered:0) + '</b> / ' + (r.languages?r.languages.total:0) + '</span>' +
    '<span class="chip">frameworks <b>' + (r.frameworks?r.frameworks.covered:0) + '</b> / ' + (r.frameworks?r.frameworks.total:0) + '</span>' +
    '<span class="chip">libraries <b>' + (r.libraries?r.libraries.covered:0) + '</b> / ' + (r.libraries?r.libraries.total:0) + '</span>' +
    '</div>';
  // ---- legend ----
  const legend = '<div class="legend">' +
    '<span><span class="sw" style="background:var(--win)"></span>win</span>' +
    '<span><span class="sw" style="background:var(--accent)"></span>ceiling-tie</span>' +
    '<span><span class="sw" style="background:var(--bar-base)"></span>uncovered</span>' +
    '<span><span class="sw" style="background:var(--loss)"></span>loss</span></div>';
  // ---- per-kind matrices ----
  const matrices = '<div class="camps-grid">' +
    renderGridKindTable(grid, 'language', 'Languages') +
    renderGridKindTable(grid, 'framework', 'Frameworks') +
    renderGridKindTable(grid, 'library', 'Libraries') +
    '</div>';
  // ---- to-build queue (the honest gaps) ----
  const q = grid.uncoveredList || [];
  let queue = '<div class="section-title">To-build queue · ' + q.length + ' uncovered cells (the honest gaps)</div>';
  if (!q.length) {
    queue += '<div class="empty">✓ Nothing uncovered — every supported cell is measured.</div>';
  } else {
    queue += '<div class="camps-grid">';
    for (const kind of ['language','framework','library']) {
      const inKind = q.filter(u => u.rowKind === kind);
      if (!inKind.length) continue;
      queue += '<div class="camp-sec"><div class="ch"><span class="cn">' + kind + ' gaps</span>' +
        '<span class="cv tie">' + inKind.length + '</span></div><div class="csub">' +
        inKind.map(u => '<span class="tag">' + escapeHtml(u.row) + ' · ' + escapeHtml(u.metric) + '</span>').join(' ') +
        '</div></div>';
    }
    queue += '</div>';
  }
  // ---- losses (loud, if any) ----
  let losses = '';
  if (grid.losses && grid.losses.length) {
    losses = '<div class="section-title">Losses — Klauro bugs (fix, do not hide)</div><div class="losses">' +
      grid.losses.map(l => '<div class="loss-row"><span class="sid">' + escapeHtml(l.rowKind + '/' + l.row) + '</span> [' +
        escapeHtml(l.metric) + '] — klauro ' + pct(l.klauroF1) + ' vs best ' + pct(l.competitorBestF1) +
        (l.note ? ' <span class="modeflag">(' + escapeHtml(l.note) + ')</span>' : '') + '</div>').join('') + '</div>';
  }
  return headline + rowsLine + legend + matrices + queue + losses;
}
routes['grid'] = async () => {
  setCrumb('Full grid');
  loadingView('measuring the full grid — running real benches, may take a moment…');
  const data = await getJSON('/api/grid');
  const grid = data && data.aggregate ? data : null;
  if (!grid) { setView('<div class="emptybox">Full grid unavailable.</div>'); return; }
  counts.grid = grid.aggregate ? (grid.aggregate.total - grid.aggregate.uncovered) : null;
  refreshNavCounts();
  setView(renderGrid(grid));
};
function wireRowLinks() {
  document.querySelectorAll('#view tr.rowlink[data-go]').forEach(tr => tr.addEventListener('click', e => {
    if (e.target.tagName === 'A') return;
    location.hash = tr.dataset.go;
  }));
}

// ============================== boot ==============================
window.addEventListener('hashchange', router);
// Bulletproof in-app navigation: force hash + render on any internal #/ link
// click, so a single render path serves nav links, breadcrumbs, and row links
// regardless of default-action quirks.
document.addEventListener('click', e => {
  const a = e.target.closest && e.target.closest('a[href^="#/"]');
  if (!a) return;
  e.preventDefault();
  const target = a.getAttribute('href').slice(1); // strip leading #
  if (location.hash.slice(1) === target) router(); else location.hash = target;
});

// SSE — keep live report flowing; refresh matrix view if it's on screen and not viewing a past run.
const es = new EventSource('/api/events');
es.addEventListener('report', e => {
  try {
    const rep = JSON.parse(e.data);
    lastReport = rep;
    updateTopBar(rep);
    const cur = parseHash().name;
    if (cur === 'scenarios' && !viewingReport) router();
    else if (cur === 'tests') router();
  } catch (err) {}
});
es.onerror = () => {};

// initial prefetch (non-blocking) for catalog + report + top bar
(async () => {
  catalog = await getJSON('/api/catalog');
  const rep = await getJSON('/api/report');
  if (rep && rep.scenarios && rep.scenarios.length) { lastReport = rep; updateTopBar(rep); }
  else updateTopBar(reportFromCatalog(catalog));
  if (catalog && catalog.scenarios) { counts.scenarios = catalog.scenarios.length; refreshNavCounts(); }
  // prime overview totals for nav counts even if user lands elsewhere
  const ov = await getJSON('/api/overview');
  if (ov && ov.totals) { counts.repos = ov.totals.repos; counts.workspaces = ov.totals.workspaces; counts.runs = ov.totals.runs; refreshNavCounts(); }
})();

router();
</script>
</body>
