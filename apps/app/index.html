<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Klauro</title>
    <!-- Favicon: real brand mark (Figma node 2005-15267 "Favicon", see
         src/assets/favicon-tile.svg). SVG favicon for modern browsers, .ico
         fallback (generated from the same SVG via rsvg-convert + ImageMagick,
         16/32/64px frames) for browsers that don't support SVG favicons. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" sizes="any" href="/favicon.ico" />
    <!-- Urbanist (primary typeface) + Inter (dense-label typeface) per
         apps/app/docs/DESIGN-TOKENS.md's Figma-observed font-family values.
         Preconnect keeps first paint fast on a cold cache. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700&family=Inter:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
