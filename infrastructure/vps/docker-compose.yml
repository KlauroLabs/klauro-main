x-analysis-environment: &analysis-environment
  KLAURO_COORD_DIR: /data/coordination
  KLAURO_TS_EXTRACTION_CACHE_PATH: /data/cache/ts-extractions
  KLAURO_ANALYZER_CONTRIBUTION_CACHE_PATH: /data/cache/analyzer-contributions
  KLAURO_AI_CACHE_PATH: /data/cache/ai
  KLAURO_AI_INTERPRETATION_FORCE: "false"
  AI_TIMEOUT: "30000"
  KLAURO_AI_PROVIDER_RETRIES: "0"
  DEEPINFRA_NARRATIVE_MODEL: "${DEEPINFRA_NARRATIVE_MODEL:-mistralai/Mistral-Small-3.2-24B-Instruct-2506}"
  DEEPINFRA_STRUCTURED_MODEL: "${DEEPINFRA_STRUCTURED_MODEL:-Qwen/Qwen3-Next-80B-A3B-Instruct}"
  DEEPINFRA_FAST_FALLBACK_MODEL: "${DEEPINFRA_FAST_FALLBACK_MODEL:-meta-llama/Meta-Llama-3.1-8B-Instruct-Turbo}"
  OPENROUTER_MODEL: "${OPENROUTER_MODEL:-tencent/hy3}"
  KLAURO_TS_PARSE_WORKERS: "2"
  KLAURO_ANALYSIS_CONCURRENCY: "1"
  KLAURO_CANONICAL_SEGMENTED_STORAGE: "1"
  KLAURO_ANALYSIS_WORKER_IDLE_MS: "0"
  KLAURO_ANALYSIS_STALL_MS: "600000"
  KLAURO_ANALYSIS_WORKER_SOCKET: /run/klauro/analysis-worker.sock
  KLAURO_ANALYSIS_HEAP_MB: "2240"
  KLAURO_HOSTED_QUERY_HEAP_MB: "1280"
  KLAURO_WORKSPACE_ANALYSIS_HEAP_MB: "512"
  REDIS_HOST: redis

services:
  api:
    build:
      context: /opt/klauro/source
      dockerfile: apps/api/Dockerfile
      args:
        KLAURO_GIT_SHA: "${KLAURO_GIT_SHA:-}"
        KLAURO_BUILD_TIME: "${KLAURO_BUILD_TIME:-}"
    image: klauro/api:alpha
    restart: unless-stopped
    init: true
    cpus: "2.0"
    mem_limit: 2048m
    memswap_limit: 2048m
    env_file:
      - /opt/klauro/.env
    environment:
      <<: *analysis-environment
      KLAURO_SELF_TELEMETRY: "1"
      KLAURO_TELEMETRY_LOCK_INSTANCE: "hosted-api"
      KLAURO_SELF_TELEMETRY_PROJECT: /data/workspaces/prj_wbW33m-wfETn1N41
      KLAURO_ANALYSIS_QUEUE_CAPACITY: "4"
      NODE_OPTIONS: --max-old-space-size=768
    expose:
      - "8787"
    depends_on:
      redis:
        condition: service_healthy
      analysis-worker:
        condition: service_healthy
    volumes:
      - /opt/klauro/data:/data
      - /opt/klauro/downloads:/opt/klauro/downloads:ro
      - analysis-worker-socket:/run/klauro
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8787/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s

  analysis-worker:
    image: klauro/api:alpha
    restart: unless-stopped
    command: ["/app/node_modules/.bin/tsx", "/app/apps/mcp-server/src/analysis-worker-service.ts"]
    init: true
    cpus: "3.0"
    mem_limit: 3328m
    memswap_limit: 3328m
    env_file:
      - /opt/klauro/.env
    environment:
      <<: *analysis-environment
      KLAURO_SELF_TELEMETRY: "0"
      NODE_OPTIONS: --max-old-space-size=512
    volumes:
      - /opt/klauro/data:/data
      - /opt/klauro/downloads:/opt/klauro/downloads:ro
      - analysis-worker-socket:/run/klauro
    tmpfs:
      - /tmp:size=512m
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "sh", "-c", "test -S /run/klauro/analysis-worker.sock"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 20s

  fabric:
    image: klauro/api:alpha
    restart: unless-stopped
    command: ["/app/node_modules/.bin/tsx", "src/fabric.ts"]
    cpus: "1.0"
    mem_limit: 768m
    memswap_limit: 768m
    env_file:
      - /opt/klauro/.env
    environment:
      KLAURO_SELF_TELEMETRY: "0"
      KLAURO_COORDINATION_ONLY: "1"
      KLAURO_COORD_DIR: /data/coordination
      KLAURO_FABRIC_PORT: "8788"
      KLAURO_TS_PARSE_WORKERS: "1"
      KLAURO_ANALYSIS_CONCURRENCY: "1"
      KLAURO_ANALYSIS_WORKER_IDLE_MS: "0"
      NODE_OPTIONS: --max-old-space-size=512
    expose:
      - "8788"
    volumes:
      - /opt/klauro/data:/data
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8788/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 640m
    memswap_limit: 640m
    command: >-
      redis-server
      --save 60 1
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - /opt/klauro/redis-data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    mem_limit: 128m
    memswap_limit: 128m
    depends_on:
      api:
        condition: service_healthy
      fabric:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /opt/klauro/Caddyfile:/etc/caddy/Caddyfile:ro
      - /opt/klauro/app-dist:/srv/app:ro
      - /opt/klauro/caddy-data:/data
      - /opt/klauro/caddy-config:/config
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  analysis-worker-socket:
