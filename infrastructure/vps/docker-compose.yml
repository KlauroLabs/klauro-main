services:
  api:
    build:
      context: /opt/klauro/source
      dockerfile: apps/api/Dockerfile
    image: klauro/api:alpha
    restart: unless-stopped
    env_file:
      - /opt/klauro/.env
    environment:
      # Dogfood Klauro's own runtime telemetry: the service emits one runtime
      # event per inbound HTTP request via @klauro/telemetry and self-ingests it
      # into the observation store, correlated against Klauro's OWN analysis.
      # KLAURO_SELF_TELEMETRY_PROJECT keys observations to a source path that is
      # PRESENT IN THE CONTAINER. The image copies apps/mcp-server to
      # /app/apps/mcp-server (see apps/api/Dockerfile), so /app/apps/mcp-server/src
      # is the mcp-server's own HTTP-handler source — analyzable and readable back
      # via `GET /v1/telemetry/node-metrics?workspace=/app/apps/mcp-server/src`.
      # The old host path (/opt/klauro/source) is NOT mounted into the container,
      # so no analysis of it ever existed and node-level correlation never happened.
      # On enable the self-loop bootstraps ONE bounded analysis of this dir if none
      # exists, so node-level self-telemetry works out of the box.
      # ENDPOINT is left UNSET on purpose → in-process transport (no network hop).
      KLAURO_SELF_TELEMETRY: "1"
      KLAURO_SELF_TELEMETRY_PROJECT: /app/apps/mcp-server/src
      # GAP #32 part 2: the canonical hosted Klauro-self analysis lives under a
      # DIFFERENT workspace path (this project's own /data/workspaces bucket)
      # than the in-container source dir the self-loop bootstraps against
      # above. Mirror every self-loop observation into that bucket too, so
      # facet-6 (get_runtime_observations / node-metrics / route telemetry)
      # queries against the canonical project see real self-telemetry instead
      # of an empty bucket. Never triggers a bootstrap analysis of this path —
      # only KLAURO_SELF_TELEMETRY_PROJECT above ever does that.
      KLAURO_SELF_TELEMETRY_CANONICAL_PROJECT: /data/workspaces/prj_wbW33m-wfETn1N41
      # Incident (2026-07-18): a version-triggered full rebuild of a large
      # monorepo (the async POST /reanalyze path's analyzeProjectLayered call —
      # see the "ASYNC REANALYZE" comment in remote-analyzer-service.ts — still
      # runs the heavy analysis IN-PROCESS via setImmediate, not through the
      # worker-fork isolation analyzer.ts already has for other paths) grew
      # this MAIN api process's heap past the host's total RAM (7.7GiB, no
      # container memory limit configured). The kernel's HOST-WIDE OOM killer
      # (dmesg: constraint=CONSTRAINT_NONE, i.e. not a cgroup-limit kill, so
      # `docker inspect`'s .State.OOMKilled never reports it) SIGKILLed the
      # node process directly, with zero log output, and docker's `restart:
      # unless-stopped` policy silently revived it — repeating every ~5-7
      # minutes since the killed rebuild never persists a completed
      # cas_version, so the next freshness check re-triggers it.
      # This heap ceiling does NOT fix that (the layered reanalyze path still
      # needs worker isolation — tracked separately), but it bounds the blast
      # radius (the process fails at ~4GB instead of exhausting the whole
      # host, which could otherwise take down unrelated host processes too)
      # AND makes the failure VISIBLE: V8 logs "FATAL ERROR: Reached heap
      # limit ... JavaScript heap out of memory" to stderr before terminating,
      # instead of the silent, unloggable SIGKILL this incident exhibited.
      # Sized to match the existing worker heap ceiling (KLAURO_ANALYSIS_HEAP_MB
      # in /opt/klauro/.env, applied via --max-old-space-size in analyzer.ts's
      # spawnAnalysisWorker) so both the in-process and forked paths fail at
      # the same, already-proven-safe threshold.
      NODE_OPTIONS: --max-old-space-size=4096
    expose:
      - "8787"
    volumes:
      - /opt/klauro/data:/data
      # Release artifacts (tarball + latest.json) live on the host; the api
      # serves /dist/klauro-latest.tgz and /dist/latest.json from here. Without
      # this mount the container can't see them → tarball 404 + version:null.
      - /opt/klauro/downloads:/opt/klauro/downloads:ro
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    # Defect #24: gives compose (and deploy.sh) a real signal for "the new api
    # container is actually serving requests", not just "the process started".
    # Used below so caddy only (re)starts against an api that is up, and by
    # deploy.sh to gate the post-recreate `docker compose restart caddy`.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8787/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /opt/klauro/Caddyfile:/etc/caddy/Caddyfile:ro
      - /opt/klauro/app-dist:/srv/app:ro
      - /opt/klauro/caddy-data:/data
      - /opt/klauro/caddy-config:/config
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
