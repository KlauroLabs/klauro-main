services:
  api:
    build:
      context: /opt/klauro/source
      dockerfile: apps/api/Dockerfile
    image: klauro/api:alpha
    restart: unless-stopped
    env_file:
      - /opt/klauro/.env
    expose:
      - "8787"
    volumes:
      - /opt/klauro/data:/data
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /opt/klauro/Caddyfile:/etc/caddy/Caddyfile:ro
      - /opt/klauro/app-dist:/srv/app:ro
      - /opt/klauro/caddy-data:/data
      - /opt/klauro/caddy-config:/config
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
