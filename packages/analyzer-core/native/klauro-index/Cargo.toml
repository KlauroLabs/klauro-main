[package]
name = "klauro-index"
version = "0.1.0"
edition = "2024"

[dependencies]
tree-sitter = "0.26"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-ruby = "0.23"
tree-sitter-php = "0.24"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-swift = "0.7"
tree-sitter-kotlin-ng = "1.1"
tree-sitter-yaml = "0.7"
tree-sitter-bash = "0.25"
tree-sitter-html = "0.23"
tree-sitter-css = "0.25"
tree-sitter-sequel = "0.3"
tree-sitter-json = "0.24"
tree-sitter-toml-ng = "0.7"
tree-sitter-dart = "0.2"
tree-sitter-elixir = "0.3"
tree-sitter-haskell = "0.23"
tree-sitter-zig = "1.1"
tree-sitter-solidity = "1.2"
tree-sitter-julia = "0.23"
tree-sitter-lua = "0.5"
tree-sitter-scala = "0.26"
tree-sitter-gdscript = "6.1"
tree-sitter-powershell = "0.26"
tree-sitter-proto = "0.6"
tree-sitter-hcl = "1.1"
tree-sitter-md = "0.5"
tree-sitter-nix = "0.3"
tree-sitter-perl = "1.1"
tree-sitter-r = "1.3"
tree-sitter-erlang = "0.20"
tree-sitter-ocaml = "0.26"
tree-sitter-groovy = "0.1"
tree-sitter-verilog = "1.0"
tree-sitter-vhdl = "1.4"
tree-sitter-elm = "5.9"
tree-sitter-gleam = "1.0"
tree-sitter-fortran = "0.6"
tree-sitter-objc = "3.0"
tree-sitter-cmake = "0.7"
tree-sitter-make = "1.1"
tree-sitter-graphql = "0.2"
tree-sitter-xml = "0.7"
tree-sitter-svelte-ng = "1.0"
tree-sitter-starlark = "1.3"
tree-sitter-ini = "1.4"
tree-sitter-fsharp = "0.3"
tree-sitter-crystal = "0.1"
tree-sitter-nim = "0.1"
tree-sitter-v = "0.0.4"
tree-sitter-d = "0.8"
tree-sitter-pascal = "0.10"
tree-sitter-ada = "0.1"
tree-sitter-matlab = "1.3"
tree-sitter-glsl = "0.2"
tree-sitter-hlsl = "0.2"
tree-sitter-odin = "1.3"
tree-sitter-jsonnet = "0.0.1"
tree-sitter-nickel = "0.5"
tree-sitter-racket = "0.25"
tree-sitter-scheme = "0.24"
tree-sitter-commonlisp = "0.4"
tree-sitter-embedded-template = "0.25"
rayon = "1.11"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1.3.1"
rustc-hash = "2.1.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[dev-dependencies]
rmpv = "1.3.1"
