name: Release
on:
  push:
    tags: ["v*"]
  schedule:
    - cron: "0 2 * * *"
jobs:
  build:
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: npm test
  deploy:
    needs: build
    environment: production
    steps:
      - name: Deploy
        run: kubectl apply -n production -f k8s/
